#  USING LET'S ENCRYPT HTTPS
#  -------------------------------------------------------------------------
#
#  If your server has a public domain name, please disable the self-signed
#  certificate and enable domain based routing in compose.yaml and
#  traefik.yaml (see inline instructions in !! UPPERCASE !!)
#
#    ssh root@<YOUR SERVER IP>
#    cd /opt/photoprism
#    nano compose.yaml
#    nano traefik.yaml
#    docker compose stop
#    docker compose up -d
#
#  You should now be able to access your instance without security warnings.
#  -------------------------------------------------------------------------

# set to DEBUG to enable debug mode
log:
  level: INFO

# disable telemetry
global:
  sendAnonymousUsage: false

# allow to proxy services with self-signed certificates
serversTransport:
  insecureSkipVerify: true
  # !! REMOVE when using Let's Encrypt HTTPS !!
  rootCAs:
    - "/certs/ca.crt"

# open ports and protocols (HTTP will be redirected to HTTPS)
entryPoints:
  web:
    address: ":80"
    http:
      # Drop request headers whose name holds a character other than a letter, digit or dash
      # (default "keep"): CGI/WSGI/PHP/NGINX backends read "X_Auth_Token" and "X-Auth-Token" as
      # one variable. See https://doc.traefik.io/traefik/security/header-aliases/
      aliasHeadersStrategy: delete
      # Set every option explicitly: Traefik changed these defaults within the v3.6 patch
      # series, so relying on them means the behavior can change under you.
      # See https://doc.traefik.io/traefik/reference/install-configuration/entrypoints/#encoded-characters
      #
      # A file name may legitimately contain a percent, hash, question mark, semicolon or
      # backslash, and WebDAV and the download routes address files by name, so those are
      # forwarded. An encoded slash is forwarded because clients send one and the application
      # resolves it inside the library root itself. A null byte cannot occur in a file name on
      # any supported filesystem, so it is the one that is refused here.
      encodedCharacters:
        allowEncodedSlash: true
        allowEncodedPercent: true
        allowEncodedHash: true
        allowEncodedQuestionMark: true
        allowEncodedSemicolon: true
        allowEncodedBackSlash: true
        allowEncodedNullCharacter: false
      redirections:
        entryPoint:
          to: websecure
          scheme: https
    transport:
      respondingTimeouts:
        readTimeout: "3h"
        writeTimeout: "0s"
        idleTimeout: "3m"
  websecure:
    address: ":443"
    http:
      # Drop request headers whose name holds a character other than a letter, digit or dash
      # (default "keep"): CGI/WSGI/PHP/NGINX backends read "X_Auth_Token" and "X-Auth-Token" as
      # one variable. See https://doc.traefik.io/traefik/security/header-aliases/
      aliasHeadersStrategy: delete
      # Set every option explicitly: Traefik changed these defaults within the v3.6 patch
      # series, so relying on them means the behavior can change under you.
      # See https://doc.traefik.io/traefik/reference/install-configuration/entrypoints/#encoded-characters
      #
      # A file name may legitimately contain a percent, hash, question mark, semicolon or
      # backslash, and WebDAV and the download routes address files by name, so those are
      # forwarded. An encoded slash is forwarded because clients send one and the application
      # resolves it inside the library root itself. A null byte cannot occur in a file name on
      # any supported filesystem, so it is the one that is refused here.
      encodedCharacters:
        allowEncodedSlash: true
        allowEncodedPercent: true
        allowEncodedHash: true
        allowEncodedQuestionMark: true
        allowEncodedSemicolon: true
        allowEncodedBackSlash: true
        allowEncodedNullCharacter: false
    transport:
      respondingTimeouts:
        readTimeout: "3h"
        writeTimeout: "0s"
        idleTimeout: "3m"

# auto tls / https
certificatesResolvers:
  myresolver:
    # See https://doc.traefik.io/traefik/https/acme/
    acme:
      # !! REPLACE "info@yourdomain.com" with your actual email address for Let's Encrypt HTTPS !!
      email: info@yourdomain.com
      storage: /data/letsencrypt.json
      httpChallenge:
        entryPoint: web

# config providers
providers:
  # !! REMOVE file provider when using Let's Encrypt HTTPS !!
  file:
    filename: "/certs/config.yml"
    watch: true
  # always keep this
  docker:
    exposedByDefault: false
    watch: true

# disable dashboard and api
api:
  insecure: false
  dashboard: false