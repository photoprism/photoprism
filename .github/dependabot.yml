version: 2

updates:
  # Keeps the action versions referenced by .github/workflows current, so a
  # major that upstream retires does not silently disable the workflow.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:00"
      timezone: "Europe/Berlin"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "CI"
    labels:
      - "dependencies"
      - "ci"
    groups:
      # One PR per weekly sweep; majors stay ungrouped so a retired major
      # arrives as its own reviewable pull request.
      actions-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
