Models:
- Type: labels
  Default: true
  Name: efficientformerv2_s1
  Version: latest
  Resolution: 224
  ONNX:
    File: efficientformerv2_s1.onnx
    Source: https://huggingface.co/timm/efficientformerv2_s1.snap_dist_in1k/resolve/0c1fc60a0e89b6309d9de451cdacc11ac0a8b987/model.safetensors
    SHA256: e289689ae6ae1e32f81f0346e7e59004d4d15b4c8df6899c008ade6f826892da
    License: unverified
    Quantization: fp32
    Input:
      Name: input
      Width: 224
      Height: 224
      Layout: NCHW
      ColorOrder: RGB
      Normalization:
        Mean:
        - 123.675
        - 116.28
        - 103.53
        StdDev:
        - 58.395
        - 57.12
        - 57.375
      Resize:
        Mode: center-crop
        ShortEdge: 236
        CropRatio: 0.95
        Interpolation: bicubic
    Output:
      Name: logits
      Width: 1000
      Count: 1
      Logits: true
  LabelFile: ../nasnet/labels.txt
  CanonicalOrder: true
- Type: nsfw
  Default: true
  Name: nsfw
  Version: latest
  Resolution: 224
  TensorFlow:
    Tags:
    - serve
    Input:
      Name: input_tensor
      Height: 224
      Width: 224
      Shape:
      - Batch
      - Height
      - Width
      - Color
    Output:
      Name: nsfw_cls_model/final_prediction
      Outputs: 5
- Type: face
  Default: true
  Name: facenet
  Version: latest
  Resolution: 160
  TensorFlow:
    Tags:
    - serve
    Input:
      Name: input
      Height: 160
      Width: 160
      Shape:
      - Batch
      - Height
      - Width
      - Color
    Output:
      Name: embeddings
      Outputs: 512
- Type: caption
  Model: gemma4:latest
  Engine: ollama
  Run: manual
  Resolution: 720
  Service:
    Uri: ${OLLAMA_BASE_URL}/api/generate
    Key: ${OLLAMA_API_KEY}
    Think: "false"
    FileScheme: base64
    RequestFormat: ollama
    ResponseFormat: ollama
Thresholds:
  Confidence: 10
  NSFW: 75
